RuppertPaper:
  type: article
  title: A Delaunay Refinement Algorithm for Quality 2-Dimensional Mesh Generation
  author: Ruppert, J.
  date: 1995
  page-range: 548-585
  url: https://www.sciencedirect.com/science/article/pii/S0196677485710218
  serial-number:
    doi: https://doi.org/10.1006/jagm.1995.1021
    issn: 0196-6774
  abstract: 'We present a simple new algorithm for triangulating polygons and planar straightline graphs, It provides "shape" and "size" guarantees: •All triangles have a bounded aspect ratio.•The number of triangles is within a constant factor of optimal. Such "quality" triangulations are desirable as meshes for the finite element method, in which the running time generally increases with the number of triangles, and where the convergence and stability may be hurt by very skinny triangles. The technique we use-successive refinement of a Delaunay triangulation-extends a mesh generation technique of Chew by allowing triangles of varying sizes. Compared with previous quadtree-based algorithms for quality mesh generation, the Delaunay refinement approach is much simpler and generally produces meshes with fewer triangles. We also discuss an implementation of the algorithm and evaluate its performance on a variety of inputs.'
  parent:
    type: periodical
    title: Journal of Algorithms
    issue: 3
    volume: 18


LawsonAlgo:
  type: anthos
  title: Software for C1 Surface Interpolation
  author: Lawson, C.L.
  date: 1977
  editor: Rice, John R.
  page-range: 161-194
  url: https://www.sciencedirect.com/science/article/pii/B978012587260750011X
  serial-number:
    doi: https://doi.org/10.1016/B978-0-12-587260-7.50011-X
    isbn: 978-0-12-587260-7
  abstract: Publisher Summary This chapter discusses algorithm and underlying theory of software for C1 surface interpolation. There has been practically no theory to guide the development of algorithms for triangulation and there has been no practical static global criterion to characterize a preferred triangulation. An interpolation algorithm is interfaced with algorithms for contour plotting or surface perspective plotting. If the subroutines are available for doing contour or surface perspective plotting for data given on a rectangular grid, then the surface interpolation algorithm can be used to produce the values needed at the lattice points of a rectangular grid. The computerized representation of surfaces is a central issue in the field of computer-aided geometric design and plays an important role in the field of finite element methods. Some methods of building a triangular grid with a given set of nodes start by locating the boundary points of the convex hull of the point set. In some reasonable triangulation algorithms, the number of boundary points of the convex hulls of a sequence of sub­sets has an effect on the operation count.
  parent:
    type: anthology
    title: Mathematical Software
    publisher: Academic Press


HalfEdgeStruct:
  type: article
  title: Designing and Implementing a General Purpose Halfedge Data Structure
  author: Brönnimann, Hervé
  date: 2001
  editor:
  - Brodal, Gerth Stølting
  - Frigioni, Daniele
  - Marchetti-Spaccamela, Alberto
  page-range: 51-66
  serial-number:
    isbn: 978-3-540-44688-0
  abstract: 'Halfedge data structures (HDS) are fundamental in representing combinatorial geometric structures, useful for representing any planar structures such as plane graphs and planar maps, polyhedral surfaces and boundary representations (BREPs), two-dimensional views of a three dimensional scene, etc. Many variants have been proposed in the literature, starting with the winged-edge data structure of Baumgart[2], the DCEL of [15,9], the quad-edge data structure [11], the halfedge data structure [18,12, and refs. therein]. They have been proposed in various frameworks (references too many to give here):Plane structures: including planar maps for GIS, 2D Boolean modeling, 2D graphics, scienti.c computations, computer vision. The requirements on HDS are that that some edges may be in.nite (e.g., Voronoi diagrams), or border edges (e.g., for bounded polygonal domains), it may include holes in the facets (planar maps), and that if so, one of the connected boundary cycle is distinguished as the outer boundary (the others are inner holes).Boundary representation of three-dimensional solids: including Brep representation, solid modeling, polyhedral surfaces, 3D graphics. The requirements here vary slightly: holes may still be allowed, but there is no need to distinguish an outer boundary, in.nite edges are not always useful but border edges might need to be allowed.'
  parent:
    type: proceedings
    title: Algorithm Engineering
    publisher:
      name: Springer Berlin Heidelberg
      location: Berlin, Heidelberg

